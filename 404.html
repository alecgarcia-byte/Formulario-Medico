<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1E40AF">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>404 — Formulário Médico Acadêmico</title>
    <link rel="stylesheet" href="pico.min.css">
    <style>
        :root {
            --color-azul-1: #1E40AF;
            --color-azul-2: #2563EB;
            --color-azul-3: #60A5FA;
            --color-fondo: #EAF1FF;
            --color-texto: #1F2A44;
            --color-enfasis: #7C3AED;
            --radius-liquid: 14px;
            --radius-pill: 9999px;
            --shadow-soft: 0 8px 24px rgba(16, 24, 40, 0.08);
            --shadow-elev: 0 18px 48px rgba(16, 24, 40, 0.18);
            --space-lg: 32px;
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto,
                'Helvetica Neue', Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-sans);
            background-color: var(--color-fondo);
            color: var(--color-texto);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg) 1rem;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -2;
            pointer-events: none;
            filter: blur(40px);
            will-change: transform, opacity;
        }
        body::before {
            width: 46vmax; height: 46vmax;
            top: -14vmax; left: -12vmax;
            border-radius: 34% 66% 62% 38% / 46% 38% 62% 54%;
            background:
                radial-gradient(circle at 30% 30%, rgba(37, 99, 235, 0.65), transparent 55%),
                radial-gradient(circle at 70% 70%, rgba(105, 42, 213, 0.55), transparent 55%);
            animation: flota_a 26s alternate infinite;
        }
        body::after {
            width: 40vmax; height: 40vmax;
            bottom: -12vmax; right: -10vmax;
            border-radius: 60% 40% 46% 54% / 60% 62% 38% 40%;
            background:
                radial-gradient(circle at 60% 40%, rgba(96, 165, 250, 0.6), transparent 55%),
                radial-gradient(circle at 30% 70%, rgba(16, 185, 129, 0.45), transparent 55%);
            animation: flota_b 32s alternate infinite;
        }
        @keyframes flota_a { to { transform: translate3d(4vmax, 3vmax, 0) rotate(14deg); } }
        @keyframes flota_b { to { transform: translate3d(-4vmax, -3vmax, 0) rotate(-11deg); } }

        .selector-idioma {
            position: fixed;
            top: 1rem; right: 1rem;
            z-index: 20;
            display: flex;
            gap: 0.4rem;
            padding: 0.4rem;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-soft);
        }
        .selector-idioma button {
            border: none;
            background: transparent;
            color: var(--color-texto);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.4rem 0.9rem;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease;
        }
        .selector-idioma button[aria-pressed="true"] {
            background: linear-gradient(120deg, var(--color-azul-1), var(--color-azul-2));
            color: #fff;
        }

        .contenedor-404 {
            max-width: 560px;
            width: 100%;
            text-align: center;
            padding: clamp(1.5rem, 5vw, 3.2rem);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: var(--radius-liquid);
            box-shadow: var(--shadow-elev);
        }

        .codigo-404 {
            font-size: clamp(4rem, 14vw, 7rem);
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(120deg, var(--color-azul-1), var(--color-azul-2), var(--color-enfasis));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: grad 6s linear infinite;
        }
        @keyframes grad { to { background-position: 300% 100%; } }

        .mensaje-404 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 1rem 0 0.4rem;
        }
        .descripcion-404 {
            color: var(--color-texto);
            opacity: 0.8;
            margin: 0 0 1.6rem;
        }

        .boton-volver {
            display: inline-block;
            padding: 0.9rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(120deg, var(--color-azul-1), var(--color-azul-2), var(--color-enfasis), var(--color-azul-1));
            background-size: 300% 100%;
            border: none;
            border-radius: var(--radius-pill);
            text-decoration: none;
            box-shadow: 0 14px 34px rgba(37, 99, 235, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            animation: grad 8s linear infinite;
        }
        .boton-volver:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 46px rgba(37, 99, 235, 0.55);
        }
    </style>
</head>
<body>
    <div class="selector-idioma" role="group" aria-label="Idioma / Language / Idioma">
        <button type="button" data-idioma="pt" lang="pt" aria-pressed="true">PT</button>
        <button type="button" data-idioma="es" lang="es" aria-pressed="false">ES</button>
        <button type="button" data-idioma="en" lang="en" aria-pressed="false">EN</button>
    </div>

    <main class="contenedor-404" lang="pt">
        <p class="codigo-404" aria-hidden="true">404</p>
        <p class="mensaje-404" data-i18n="mensaje">Página não encontrada</p>
        <p class="descripcion-404" data-i18n="descripcion">
            O endereço que você acessou não existe, foi movido ou está temporariamente indisponível.
        </p>
        <a class="boton-volver" href="/" data-i18n="volver">Voltar ao formulário</a>
    </main>

    <script src="404.js"></script>
</body>
</html>
